name: Rates Back-fill

on:
  # The daily note runs ~6:20pm ET and sometimes finds the US Treasury par-yield
  # CSV not yet published, shipping provisional Yahoo 10Y/30Y (or no rates). The
  # Treasury feed lands by evening but can lag, so this re-checks a few hours
  # later and again the next morning, swapping in the authoritative curve. Fixed
  # UTC cron, so each ET target fires twice (EDT summer / EST winter); the pass is
  # idempotent, so a note already on the Treasury curve is simply skipped.
  schedule:
    - cron: '30 1 * * 2-6' # ~9:30pm ET same evening (EDT); 8:30pm EST
    - cron: '30 2 * * 2-6' # ~9:30pm ET same evening (EST); 10:30pm EDT
    - cron: '0 12 * * 1-5' # ~8am ET next morning — catches an overnight publish
  workflow_dispatch:
    inputs:
      lookbackDays:
        description: 'How many days back to scan'
        required: false
        default: '7'

# Serialize so two overlapping runs can't both edit the same message.
concurrency:
  group: rates-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Back-fill authoritative Treasury yields
        run: npx tsx scripts/pipelines/run-rates-backfill.ts ${{ github.event.inputs.lookbackDays }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            -d "text=❌ Rates back-fill failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
