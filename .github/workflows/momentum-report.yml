name: Momentum Gainers Report

on:
  # Weekdays at 00:35 UTC = 08:35 SGT.
  #
  # The snapshot job (momentum-gainers.yml) runs at 00:00 UTC and the scanner
  # hourly at :05. Running at :30 raced the 00:05 scan: cron drift meant the
  # report sometimes saw a scan containing live Tokyo/Seoul session data while
  # US names still sat at the prior close, so the "today" side of the delta was
  # a moving target. :35 lands after the 00:05 scan has settled.
  schedule:
    - cron: '35 0 * * 1-5'
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Selection logic: src/lib/markets/momentum-report.ts
      # Orchestration:   scripts/pipelines/run-momentum-report.ts
      # (Previously an inline `npx tsx -e` string that could not be typechecked
      # or unit-tested, and whose SQL literals had to avoid apostrophes.)
      - name: Generate and send momentum gainers report
        run: npx tsx scripts/pipelines/run-momentum-report.ts
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}

      - name: Summary
        if: always()
        run: |
          echo "## Momentum Gainers Report" >> $GITHUB_STEP_SUMMARY
          echo "- Run time: $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            -d "text=⚠️ Momentum gainers report failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
