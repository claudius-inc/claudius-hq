name: Convergence Report

# THE SCHEDULE IS REMOVED ON PURPOSE — DO NOT RESTORE IT.
#
# Binance answers HTTP 451 to GitHub-hosted runners: "Service unavailable from a
# restricted location according to 'b. Eligibility'". The block is enforced on
# datacenter IP RANGES, not merely on US geography, so no runner image, region
# or retry setting fixes it. The one scheduled run this workflow ever attempted
# failed at its first call, before fetching a single bar.
#
# The daily fetch now runs from a VPS in a permitted region — see
# scripts/ops/daily-fetch.sh. That box writes everything to Turso, and both the
# Telegram push and /markets/shortlist read from there, so nothing downstream
# depends on where anything is hosted.
#
# workflow_dispatch is kept only so the pipeline can still be triggered by hand
# from a runner that IS permitted (a self-hosted one). Expect 451 on a
# GitHub-hosted runner.
on:
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Selection logic: src/lib/markets/convergence-screen.ts
      # Indicator port:  src/lib/markets/mcd.ts
      # Venue adapter:   src/lib/markets/perp-venues.ts
      # Orchestration:   scripts/pipelines/run-convergence-report.ts
      #
      # Replaces the separate Crypto Report and Momentum Gainers Report, which
      # pushed twice a day over two different universes.
      - name: Generate and send convergence report
        run: npx tsx scripts/pipelines/run-convergence-report.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## Convergence Report" >> $GITHUB_STEP_SUMMARY
          echo "- Run time: $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            -d "text=⚠️ Convergence report failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
