name: Crypto Report

on:
  schedule:
    # Daily at 01:00 UTC = 09:00 SGT. Crypto trades 24/7 so the exact time
    # does not matter; offset from the stock reports to avoid overlapping sends.
    - cron: '0 1 * * *'
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Screen logic: src/lib/markets/crypto-screen.ts
      # Orchestration:  scripts/pipelines/run-crypto-report.ts
      # (Previously an inline `node -e` string, which could not be typechecked,
      # unit-tested, or contain an apostrophe.)
      - name: Generate and send crypto report
        run: npx tsx scripts/pipelines/run-crypto-report.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          # Free CoinGecko Demo API key. Without it the public endpoint still
          # works but GitHub runner IPs are often rate-limited (HTTP 429).
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## Crypto Report" >> $GITHUB_STEP_SUMMARY
          echo "- Run time: $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            -d "text=⚠️ Crypto report failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
